name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Smoke test the CLI on a fixture project
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'DEBUG=true\nDATABASE_URL="postgres://app:dev@dev-db/app"\n' > "$tmp/.env.development"
          printf 'DEBUG=True\nDATABASE_URL="postgres://app:prod@prod-db/app"\n' > "$tmp/.env.production"
          set +e
          env-drift scan "$tmp" --format json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on drift, got $code"
            exit 1
          fi
